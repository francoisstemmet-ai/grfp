<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | SA Food Merchants</title>
  <meta name="description" content="The page you are looking for could not be found. Return to SA Food Merchants.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/GRFP-Logo.png" sizes="any">
  <link rel="apple-touch-icon" href="/assets/img/GRFP-Logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 0;
    }
    .error-code {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      color: var(--grfp-red);
      text-shadow: 0 0 45px var(--grfp-red-glow);
      margin-bottom: 0.5rem;
    }
    .error-rule {
      width: 64px;
      height: 3px;
      background: var(--grfp-red);
      border-radius: var(--radius-pill);
      margin: 1.5rem auto 1.75rem;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 2.5rem;
    }
  </style>
</head>
<body class="error-page">

  <div class="container">
    <div class="error-code">404</div>
    <h1 class="section-title">This route doesn't exist</h1>
    <div class="error-rule"></div>
    <p class="section-subtitle" style="max-width: 560px; margin: 0 auto;">
      The page you're looking for has been moved, renamed, or never existed. Let's get you back to solid ground.
    </p>

    <div class="error-actions">
      <a href="/" class="btn btn-primary">
        <i class="fas fa-house"></i> Back to Home
      </a>
      <a href="/#contact" class="btn btn-outline">
        <i class="fas fa-envelope"></i> Contact Us
      </a>
    </div>
  </div>

</body>
</html>
